version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - intrange
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    perfsprint:
      strconcat: true
      sprintf1: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
  exclusions:
    generated: lax
    rules:
      - path: (_test\.go|^internal/testkit/)
        linters:
          - errcheck
          - gosec
          - unparam
      # These files are the audited boundary between typed values and raw memory.
      - path: ^(allocator|arena|direct|direct_bsd|direct_linux|direct_unix|direct_windows|guard|guard_unchecked|layout|memory|populate|profile|protect|region|region_file|region_file_unix|region_file_windows|span|string)\.go$
        linters:
          - gosec
        text: G103
      # Sizes and offsets here are bounded by the span and class constants.
      - path: ^(allocator|arena|guard|span|internal/swiss/swiss)\.go$
        linters:
          - gosec
        text: G115
      # Lengths and element sizes here are bounded by maxRegionLen and the element type.
      - path: ^(region|region_file|region_file_windows)\.go$
        linters:
          - gosec
        text: G115
      - path: ^(hashmap/strings|intern/intern|pool/pool|union/union)\.go$
        linters:
          - gosec
        text: G103

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/stubbedev/memory-go)
  exclusions:
    generated: lax
