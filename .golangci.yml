version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - intrange
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    perfsprint:
      strconcat: true
      sprintf1: true
    revive:
      enable-default-rules: true
      rules:
        # Stub doc comments are noise; package docs carry the context.
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
      # layout.go is the single audited boundary between typed values and raw memory.
      - path: ^layout\.go$
        linters:
          - gosec
        text: G103

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/stubbedev/memory-go)
  exclusions:
    generated: lax
